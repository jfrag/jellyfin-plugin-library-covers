# Bumping "version" in meta.json on main builds the plugin, creates the vX.Y.Z.W tag and a release with the
# installable .zip, then adds the version to manifest.json (the repository read by the Jellyfin catalogue).
# Nothing happens if a release for that version already exists.
name: Release

on:
  push:
    branches: [main]
    paths: ['meta.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        id: version
        run: |
          VERSION=$(jq -r .version meta.json)
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.version.outputs.skip != 'true'
        with:
          dotnet-version: '10.0.x'

      - name: Build
        if: steps.version.outputs.skip != 'true'
        run: >
          dotnet build Jellyfin.Plugin.LibraryCovers/Jellyfin.Plugin.LibraryCovers.csproj -c Release -nologo
          -p:Version=$VERSION -p:AssemblyVersion=$VERSION -p:FileVersion=$VERSION

      - name: Package
        if: steps.version.outputs.skip != 'true'
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ZIP="library-covers_${VERSION}.zip"
          mkdir -p dist/pkg
          cp Jellyfin.Plugin.LibraryCovers/bin/Release/net10.0/Jellyfin.Plugin.LibraryCovers.dll dist/pkg/
          jq --arg ts "$TIMESTAMP" '.timestamp = $ts' meta.json > dist/pkg/meta.json
          (cd dist/pkg && zip -X -q "../$ZIP" Jellyfin.Plugin.LibraryCovers.dll meta.json)
          {
            echo "ZIP=$ZIP"
            echo "TIMESTAMP=$TIMESTAMP"
            echo "CHECKSUM=$(md5sum "dist/$ZIP" | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"

      - name: Publish release
        if: steps.version.outputs.skip != 'true'
        run: |
          gh release create "$TAG" "dist/$ZIP" \
            --target "$GITHUB_SHA" \
            --title "Library Covers $VERSION" \
            --notes "$(jq -r .changelog meta.json)"

      - name: Update manifest.json
        if: steps.version.outputs.skip != 'true'
        run: |
          git fetch --depth=1 origin main
          git checkout -B main origin/main
          python3 .github/scripts/update_manifest.py manifest.json meta.json "$VERSION" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP}" \
            "$CHECKSUM" "$TIMESTAMP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "manifest: Library Covers $VERSION"
          git push origin main
